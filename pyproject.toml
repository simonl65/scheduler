[project]
name = "micropython-scheduler"
version = "1.2.1"
description = "Cooperative scheduler module for MicroPython."
license = "SUL-1.0"
license-files = [ "LICENSE.md" ]
authors = [
    { name = "S. R. Lincoln", email = "oss@codeability.co.uk" },
]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: MicroPython",
]
dependencies = []

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scheduler*"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]


# --- Ruff ---
[tool.ruff]
src = ["urst"]
line-length = 80
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.format]
quote-style = "double"
indent-style = "space"


# --- Pytest ---
[tool.pytest.ini_options]
minversion = "6.0"
pythonpath = ["scheduler"]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py", "*_tests.py"]
